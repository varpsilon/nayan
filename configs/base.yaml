# model config
model:
  # image dimensions
  channels: 3
  image_size: 64
  
  # u-net architecture  
  hidden_dim: 128
  num_layers: 4
  num_heads: 4
  dim_head: 64
  ff_mult: 4
  
  # time embedding
  time_emb_dim: 256
  
  # dropout
  dropout: 0.1

# training config
training:
  batch_size: 16
  learning_rate: 1e-4
  weight_decay: 0.01
  num_steps: 1000000
  lr_schedule: cosine
  
  # noise schedule
  noise_type: linear
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

# optimizer
optimizer:
  type: adamw
  betas: [0.9, 0.999]

# sampling
sampling:
  num_steps: 50
  noise_schedule: cosine

# logging
logging:
  log_every: 100
  val_every: 1000
  save_every: 5000
  checkpoint_dir: checkpoints/
  output_dir: outputs/

# data
data:
  name: lavender
  path: data/lavender
  num_workers: 4