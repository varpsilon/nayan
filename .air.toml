root = "."
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "python src/train.py"
  cmd = "echo 'building...'"
  delay = 1000
  exclude_dir = ["assets", "tmp"]
  exclude_ext = ["_test.go", "_test.py"]
  exclude_file = []
  fail_fast = true
  include_dir = []
  include_ext = ["py"]
  include_file = []
  kill_delay = "0s"
  log_level = "debug"
  poll = false
  postpone_stderr = true
  stop_on_root = false
  stop_on_error = true
  subject_bin = ""

[log]
  time = true

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = true
  keep_alive = true